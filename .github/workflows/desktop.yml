name: Stagehand desktop

# Builds the Mac (.dmg) and Windows (.exe) installers on real Mac and Windows machines.
# Every push that changes the app leaves the installers on the run's page (Artifacts);
# pushing a tag like v1.0.0 also publishes them as a GitHub Release, and so does running the workflow
# by hand (Actions → Stagehand desktop → Run workflow) with a release tag filled in.
on:
  push:
    branches: ['**']
    paths: ['index.html', 'manifest.webmanifest', 'icons/**', 'desktop/**', '.github/workflows/desktop.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag, e.g. v1.0.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build installer
        run: npm run dist:${{ matrix.target }}
        env:
          # no signing certificates yet: the Mac app is ad-hoc signed, the Windows one unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Stagehand-${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*-x64.exe
            desktop/dist/*-arm64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Mac: open the .dmg and drag Stagehand to Applications.
          Windows: run Stagehand-Setup (x64 for most PCs, arm64 for Snapdragon / Copilot+ PCs).
          First-open steps for unsigned builds are in desktop/README.md.
          NOTES
          # creates the tag on this commit when it doesn't exist yet
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Stagehand ${TAG#v}" --notes-file notes.md
